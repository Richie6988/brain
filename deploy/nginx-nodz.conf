# Nodz - site nginx
# Cible : /etc/nginx/sites-available/nodz (puis ln -s vers sites-enabled/)
# Remplacer test.nodz.example par le vrai domaine, puis : sudo certbot --nginx -d <domaine>
# Les médias ne sont PAS exposés : les fichiers utilisateurs passent par des vues authentifiées.

upstream nodz_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.nodz.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.nodz.example;

    ssl_certificate     /etc/letsencrypt/live/test.nodz.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.nodz.example/privkey.pem;

    client_max_body_size 12m;   # DATA_UPLOAD_MAX_MEMORY_SIZE = 10 Mo
    charset utf-8;

    location /static/ {
        alias /home/nodz/brain/static/;
        access_log off;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://nodz_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://nodz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
