# Nodz servi sous /nodz/ dans le site nginx de paintit.
# Cible : /etc/nginx/snippets/nodz.conf, inclus dans le bloc `server` HTTPS de paintit.click :
#     include snippets/nodz.conf;
# Django reçoit le chemin complet (/nodz/...) et retire le préfixe via NODZ_URL_PREFIX=/nodz.
# ^~ : ces blocs passent devant d'éventuelles règles regex du site de paintit (ex. location ~* \.css$).

location = /nodz { return 301 /nodz/; }

location ^~ /nodz/static/ {
    alias /home/nodz/brain/static/;
    include /etc/nginx/mime.types;
    access_log off;
    expires 7d;
}

# Channels ne retire pas le préfixe : nginx le fait pour le WebSocket.
location ^~ /nodz/ws/ {
    proxy_pass http://127.0.0.1:8001/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

location ^~ /nodz/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 12m;
}
