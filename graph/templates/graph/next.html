{% load static %}<!DOCTYPE html>
<html lang="fr" data-base="{{ NODZ_BASE }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nodz</title>
    <link rel="icon" href="{% static 'img/icon.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'nodz/nodz.css' %}">
</head>
<body>
    {% csrf_token %}
    <svg id="nodz" xmlns="http://www.w3.org/2000/svg"><g id="universe" transform="translate(0,0) scale(1)"></g></svg>
    <div id="login" hidden>
        <div class="panel">
            <button id="guest" type="button">GUEST</button>
            <a href="{% url 'universe' %}">Se connecter</a>
        </div>
    </div>
    <div id="status" role="status"></div>
    <nav id="toolbar" aria-label="Navigation">
        <input id="search" type="search" placeholder="Rechercher" aria-label="Rechercher dans le plan" autocomplete="off">
        <span id="search-count" aria-live="polite"></span>
        <button type="button" class="menuBtn" id="fullscreen-button" title="Plein écran" style="--icon: url('{% static 'img/full-screen.svg' %}')"></button>
        <button type="button" class="menuBtn" id="links-button"
            style="--gradient: url('{% static 'img/gradlink.svg' %}'); --neutral: url('{% static 'img/link.svg' %}'); --hidden: url('{% static 'img/nolink.svg' %}')"></button>
        <button type="button" class="menuBtn" id="flag-button" title="Nouvelle origine" style="--icon: url('{% static 'img/flag.svg' %}')"></button>
        <button type="button" class="menuBtn" id="origin-button" title="Retour à l'origine" style="--icon: url('{% static 'img/reset.svg' %}')"></button>
        <button type="button" id="layers-button" aria-controls="layers-list" title="Plans (Maj)">Plans</button>
        <ul id="layers-list" hidden></ul>
    </nav>
    <img id="pin" src="{% static 'img/pin.svg' %}" alt="" hidden>
    <div id="node-tools" class="anchor" hidden
        data-icon-circle="{% static 'img/circle.svg' %}" data-icon-square="{% static 'img/square.svg' %}"
        data-icon-hide="{% static 'img/hide.svg' %}" data-icon-lock="{% static 'img/lock.svg' %}" data-icon-unlock="{% static 'img/unlock.svg' %}">
        <select class="type" aria-label="Type du node">
            <option value="text">Texte</option><option value="image">Image</option><option value="file">Fichier</option>
            <option value="video">Vidéo</option><option value="audio">Audio</option><option value="model3d">3D</option><option value="code">Code</option>
        </select>
        <label class="color" title="Couleur"><img src="{% static 'img/colorpicking.svg' %}" alt=""><input type="color" aria-label="Couleur"></label>
        <button type="button" class="shape" title="Forme"><img alt=""></button>
        <button type="button" class="lock" title="Verrou"><img alt=""></button>
        <button type="button" class="layer" title="Envoyer vers un plan"><img src="{% static 'img/layer.svg' %}" alt=""></button>
    </div>
    <div id="layer-menu" class="anchor" hidden></div>
    <div id="size-handle" class="anchor" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12 7 7v3h10V7l5 5-5 5v-3H7v3z"/></svg>
    </div>
    <div id="portal-handle" class="anchor" hidden>
        <button type="button" title="Voyager par le portail"><img src="{% static 'img/quantum.svg' %}" alt=""></button>
    </div>
    <div id="dock">
        <div id="reply" aria-live="polite" hidden></div>
        <form id="command" autocomplete="off">
            <button type="button" id="library-toggle" aria-controls="library">Agents</button>
            <textarea id="prompt" rows="1" placeholder="Demande au Gardien" enterkeyhint="send" aria-label="Demande au Gardien"></textarea>
            <button type="submit" id="send">Envoyer</button>
        </form>
    </div>
    <aside id="library" aria-label="Bibliothèque" hidden>
        <header><h2>Bibliothèque</h2><button type="button" id="library-close">Fermer</button></header>
        <p id="library-engine"></p>
        <p id="library-state" role="status"></p>
        <h3>Agents</h3>
        <ul id="agent-list"></ul>
        <h3>Modèles</h3>
        <ul id="model-list"></ul>
        <section id="hub" hidden>
            <h3>Ajouter un modèle</h3>
            <ul id="recommended"></ul>
            <form id="hub-search">
                <input type="search" name="q" placeholder="Rechercher sur Hugging Face" aria-label="Recherche Hugging Face">
                <select name="sort" aria-label="Tri">
                    <option value="downloads">Populaires</option>
                    <option value="trending">Tendance</option>
                    <option value="likes">Aimés</option>
                    <option value="recent">Récents</option>
                </select>
                <button type="submit">Chercher</button>
            </form>
            <ul id="hub-results"></ul>
        </section>
    </aside>
    <script type="module" src="{% static 'nodz/main.js' %}"></script>
</body>
</html>
