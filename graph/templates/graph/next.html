{% load static %}<!DOCTYPE html>
<html lang="fr" data-base="{{ NODZ_BASE }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nodz</title>
    <link rel="icon" href="{% static 'img/icon.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'nodz/nodz.css' %}">
</head>
<body>
    {% csrf_token %}
    <svg id="nodz" xmlns="http://www.w3.org/2000/svg"><g id="universe" transform="translate(0,0) scale(1)"></g></svg>
    <div id="login" hidden>
        <div class="panel">
            <button id="guest" type="button">GUEST</button>
            <a href="{% url 'universe' %}">Se connecter</a>
        </div>
    </div>
    <div id="status" role="status"></div>
    <div id="dock">
        <div id="reply" aria-live="polite" hidden></div>
        <form id="command" autocomplete="off">
            <button type="button" id="library-toggle" aria-controls="library">Agents</button>
            <textarea id="prompt" rows="1" placeholder="Demande au Gardien" enterkeyhint="send" aria-label="Demande au Gardien"></textarea>
            <button type="submit" id="send">Envoyer</button>
        </form>
    </div>
    <aside id="library" aria-label="Bibliothèque" hidden>
        <header><h2>Bibliothèque</h2><button type="button" id="library-close">Fermer</button></header>
        <p id="library-engine"></p>
        <p id="library-state" role="status"></p>
        <h3>Agents</h3>
        <ul id="agent-list"></ul>
        <h3>Modèles</h3>
        <ul id="model-list"></ul>
        <section id="hub" hidden>
            <h3>Ajouter un modèle</h3>
            <ul id="recommended"></ul>
            <form id="hub-search">
                <input type="search" name="q" placeholder="Rechercher sur Hugging Face" aria-label="Recherche Hugging Face">
                <select name="sort" aria-label="Tri">
                    <option value="downloads">Populaires</option>
                    <option value="trending">Tendance</option>
                    <option value="likes">Aimés</option>
                    <option value="recent">Récents</option>
                </select>
                <button type="submit">Chercher</button>
            </form>
            <ul id="hub-results"></ul>
        </section>
    </aside>
    <script type="module" src="{% static 'nodz/main.js' %}"></script>
</body>
</html>
