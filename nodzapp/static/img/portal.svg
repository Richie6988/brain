<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Portail vers une autre dimension : cœur lumineux qui respire, trois anneaux en pointillés qui tournent à des
       vitesses et sens différents, une particule en orbite. Animé dans l'image : aucun script. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#b89af2"/>
      <stop offset="0.75" stop-color="#6848A6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6848A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E90FF"/>
      <stop offset="0.5" stop-color="#b89af2"/>
      <stop offset="1" stop-color="#33FF99"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#050c17" fill-opacity="0.85"/>
  <circle cx="32" cy="32" r="14" fill="url(#core)">
    <animate attributeName="r" values="11;15;11" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="27" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="30 12 8 12">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="21" stroke="#1E90FF" stroke-opacity="0.85" stroke-width="2" stroke-dasharray="18 10">
      <animateTransform attributeName="transform" type="rotate" from="360 32 32" to="0 32 32" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="15.5" stroke="#33FF99" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 7">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="32" cy="5" r="2.2" fill="#ffffff">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="-360 32 32" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
