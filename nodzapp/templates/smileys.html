          <script>

            function closeSmileys() {
                const smileys = document.getElementById('smileys');
                smileys.style.display = 'none';
                overlay = false;
            }

            document.getElementById('smileys').addEventListener('mousedown', () => {
                event.preventDefault();
            });

            document.getElementById('smileys').addEventListener('contextmenu', () => {
                event.preventDefault();
            });

            const visibilityChangeEvent = new Event('visibilityChange');
            // Attach click event to each emoji
            document.querySelectorAll('.emoji-item').forEach(item => {
                item.addEventListener('click', function() {
                    const smileys = document.getElementById('smileys');
                    smileys.data = item.innerHTML;
                    smileys.style.display = 'none'; 
                    overlay = false;
                    smileys.dispatchEvent(visibilityChangeEvent);
                });
            });         
          </script>

          <style>

            .smileyContent {
                position: relative;
                background-color: #f8f9fa;
                padding: 40px;
                width: fit-content;
                max-height: 85vh;
                margin: 0 auto;
                border-radius: 15px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
                overflow-y: auto;
            }
            #emojiPicker {
              display: grid;
              grid-template-columns: repeat(6, 1fr);
              gap: 10px;
              max-width: 480px;
              margin: 0 auto;
            }
            .emoji-item {
              display: inline-block;
              cursor: pointer;
              padding: 0.5rem;
              font-size: 25px;
              text-align: center;
              border-radius: 8px;
              transition: background-color 0.2s;
              display: flex;
              justify-content: center;
              align-items: center;
            }
            .emoji-item:hover {
              background-color: #f0f0f0;
            }
            .sr-only {
              position: absolute;
              width: 1px;
              height: 1px;
              margin: -1px;
              padding: 0;
              border: 0;
              clip: rect(0, 0, 0, 0);
              clip-path: inset(50%);
              white-space: nowrap;
              overflow: hidden;
            }
          </style>
