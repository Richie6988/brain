<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Même style que la connexion : verre sombre, Cascadia Code, bouton en dégradé ; fond transparent (iframe). */
        body { margin: 0; padding: 4px 2px; background: transparent; color: #e2e8f0; font-family: 'Cascadia Code', monospace; }
        h1 {
            margin: 0 0 10px; text-align: center; font-size: 1.6rem; font-weight: 700;
            background: linear-gradient(135deg, #6848A6, #1E90FF); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        p { margin: 0 0 12px; text-align: center; font-size: 12px; color: #94a3b8; }
        form { display: flex; flex-direction: column; gap: 8px; }
        input {
            box-sizing: border-box; width: 100%; padding: 10px 14px; font: 13px 'Cascadia Code', monospace; color: #e2e8f0;
            background: rgba(148, 163, 184, 0.12); border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #94a3b8; }
        input:focus { outline: none; border-color: rgba(184, 154, 242, 0.85); box-shadow: 0 0 0 3px rgba(104, 72, 166, 0.3); }
        .submit-button {
            padding: 10px; cursor: pointer; font: 600 13px 'Cascadia Code', monospace; letter-spacing: 0.06em; color: #fff;
            background: linear-gradient(135deg, #6848A6, #1E90FF); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px;
            box-shadow: 0 0 14px rgba(104, 72, 166, 0.45); transition: filter 0.15s, box-shadow 0.15s, transform 0.15s;
        }
        .submit-button:hover { filter: brightness(1.12); box-shadow: 0 0 20px rgba(30, 144, 255, 0.6); transform: translateY(-1px); }
        .alert { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; font-size: 12px; text-align: center; }
        .alert-success { color: #86efac; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.35); }
        .alert-error { color: #FF6B6B; background: rgba(255, 107, 107, 0.12); border: 1px solid rgba(255, 107, 107, 0.35); }
    </style>
</head>
<body>

    <h1>Forgotten Password</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% if not success %}
        <p>{% if error_message %} {{ error_message }} {% else %} Enter your email address, and we will send you a new temporary password. {% endif %}</p>

        <form method="POST" action="{% url 'new_password' %}">
            {% csrf_token %}
            <input type="email" id="email" name="email" placeholder="Your email address" required>
            <button type="submit" class="submit-button">Confirm</button>
        </form>
    {% endif %}

</body>
</html>
