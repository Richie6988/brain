<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            color: #4b0082;
        }

        p {
            text-align: center;
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            padding: 15px;
            margin-top: 5px;
            margin-top: 15px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        input:focus, textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 10px;
        }

        .submit-button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            margin-top: 5px;
        }

        .submit-button {
            background-color: #663399;
            color: white;
            transition: background-color 0.3s ease;
        }

        .submit-button:hover {
            background-color: #4b0082;
            transform: scale(1.02);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .alert {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-size: 1rem;
            text-align: center;
        }

        .alert-success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }

        .alert-error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
    </style>
</head>
<body>

    <h1>Forgotten Password</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% if not success %}
        <p>{% if error_message %} {{ error_message }} {% else %} Enter your email address, and we will send you a new temporary password. {% endif %}</p>

        <form method="POST" action="{% url 'new_password' %}">
            {% csrf_token %}
            <input type="email" id="email" name="email" placeholder="Your email address" required>
            <button type="submit" class="submit-button" style="margin-top: 5px;">Confirm</button>
        </form>
    {% endif %}

</body>
</html>
